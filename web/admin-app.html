<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXIOS. FINANCE — لوحة الإدارة</title>

<style>
  :root {
    --bg-dark:#03060D; --navy-deep:#0B192C; --emerald:#00E676; --cyan-tech:#00B4D8; --cyan-soft:#48CAE4;
    --gold:#D4AF37; --danger:#FF5252; --surface-card:#091322; --surface-inner:#050B14;
    --border-subtle:#152742; --text-muted:#8FA0B5;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg-dark); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Arabic',sans-serif; }
  .layout { display:flex; min-height:100vh; }

  .sidebar { width:236px; background:var(--navy-deep); border-left:1px solid var(--border-subtle); flex-shrink:0; padding:20px 14px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:8px; padding:6px 6px 18px; border-bottom:1px solid var(--border-subtle); margin-bottom:14px; }
  .brand span { font-size:13px; font-weight:800; }
  .brand .dot { color:var(--emerald); }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; font-size:13px; color:var(--text-muted); cursor:pointer; margin-bottom:3px; }
  .nav-item svg { width:16px; height:16px; flex-shrink:0; }
  .nav-item.active { background:rgba(0,230,118,.15); color:var(--emerald); font-weight:700; border-right:3px solid var(--emerald); }
  .nav-section { font-size:9.5px; color:#5E7387; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:14px 12px 6px; }
  .nav-tag { margin-top:auto; font-size:10px; color:#5E7387; padding:10px 6px; line-height:1.7; }

  .main { flex:1; padding:26px 30px; overflow-x:auto; }
  .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .header-row h1 { font-size:19px; margin:0; }
  .header-row p { font-size:12px; color:var(--text-muted); margin:3px 0 0; }
  .env-pill { font-size:11px; background:rgba(212,175,55,.15); color:var(--gold); padding:4px 12px; border-radius:99px; font-weight:700; border:1px solid rgba(212,175,55,.3); }

  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .kpi-card { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:12px; padding:18px; }
  .kpi-label { font-size:11px; color:var(--text-muted); }
  .kpi-value { font-size:22px; font-weight:800; margin-top:5px; }
  .kpi-note { font-size:10px; margin-top:3px; }

  .grid-2 { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:20px; }
  .panel { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:16px; padding:18px; margin-bottom:18px; }
  .panel h2 { font-size:13.5px; margin:0 0 13px; display:flex; align-items:center; gap:7px; color:var(--cyan-tech); }
  .panel h2 svg { width:15px; height:15px; }
  .panel-note { font-size:11px; color:var(--text-muted); margin:-8px 0 14px; }

  .table-wrapper { width:100%; overflow-x:auto; border:1px solid var(--border-subtle); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:12px; text-align:right; }
  th { background:#11223d; color:var(--text-muted); padding:12px; font-weight:600; white-space:nowrap; }
  td { padding:12px; border-top:1px solid var(--border-subtle); white-space:nowrap; }
  code { background:var(--bg-dark); padding:2px 6px; border-radius:5px; font-size:11px; color:var(--cyan-tech); }

  .badge { font-size:10px; padding:3px 9px; border-radius:99px; font-weight:700; white-space:nowrap; }
  .badge-ok { background:rgba(0,230,118,.15); color:var(--emerald); }
  .badge-open { background:rgba(255,82,82,.15); color:var(--danger); }
  .badge-half { background:rgba(212,175,55,.15); color:var(--gold); }
  .badge-pending { background:rgba(0,180,216,.15); color:var(--cyan-tech); }
  .status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-left:6px; }
  .dot-green{background:var(--emerald)} .dot-red{background:var(--danger)} .dot-amber{background:var(--gold)}

  .alert { display:flex; gap:9px; align-items:flex-start; padding:11px; border-radius:11px; background:rgba(255,82,82,.1); border:1px solid rgba(255,82,82,.25); margin-bottom:8px; font-size:11.5px; }
  .alert.info { background:rgba(0,180,216,.1); border-color:rgba(0,180,216,.25); }
  .alert.warn { background:rgba(212,175,55,.1); border-color:rgba(212,175,55,.25); }
  .alert svg { width:15px; height:15px; flex-shrink:0; margin-top:1px; }
  .alert b { display:block; margin-bottom:2px; font-size:12px; }
  .alert span.muted { color:var(--text-muted); }

  .btn { border:none; border-radius:9px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn svg { width:13px; height:13px; }
  .btn-primary { background:var(--emerald); color:var(--bg-dark); }
  .btn-ghost { background:var(--surface-inner); color:#fff; border:1px solid var(--border-subtle); }
  .btn-sm { padding:5px 10px; font-size:10.5px; border-radius:7px; }
  .btn-approve { background:rgba(0,230,118,.18); color:var(--emerald); border:1px solid var(--emerald); }
  .btn-reject { background:rgba(255,82,82,.18); color:var(--danger); border:1px solid var(--danger); }
  .btn-approve:disabled, .btn-reject:disabled { opacity:.35; cursor:default; }

  .tab-row { display:flex; gap:6px; margin-bottom:14px; }
  .tab-pill { padding:7px 14px; border-radius:99px; font-size:12px; font-weight:700; cursor:pointer; border:1px solid var(--border-subtle); background:var(--surface-inner); color:var(--text-muted); }
  .tab-pill.active { background:var(--emerald); color:var(--bg-dark); border-color:var(--emerald); }

  .search-box { display:flex; align-items:center; gap:8px; background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:9px 13px; margin-bottom:14px; max-width:320px; }
  .search-box svg { width:15px; height:15px; color:var(--text-muted); }
  .search-box input { border:none; background:none; outline:none; font-size:12.5px; color:#fff; flex:1; font-family:inherit; }

  .settings-row { display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border-subtle); font-size:12.5px; }
  .settings-row:last-child { border-bottom:none; }
  .toggle { width:40px; height:23px; border-radius:99px; position:relative; border:none; cursor:pointer; }
  .toggle.on{background:var(--cyan-tech)} .toggle.off{background:var(--border-subtle)}
  .knob{position:absolute;top:2px;width:19px;height:19px;border-radius:50%;background:#fff}
  .toggle.on .knob{right:2px} .toggle.off .knob{left:2px}

  .doc-row { display:flex; justify-content:space-between; align-items:center; padding:13px; border:1px solid var(--border-subtle); border-radius:10px; margin-bottom:9px; background:var(--surface-inner); }
  .doc-row .name { font-size:12.5px; font-weight:700; }
  .doc-row .meta { font-size:10.5px; color:var(--text-muted); margin-top:3px; }

  .reg-tag { display:inline-block; font-size:9.5px; background:rgba(72,202,228,.12); color:var(--cyan-soft); border:1px solid rgba(72,202,228,.3); padding:2px 8px; border-radius:6px; margin-left:5px; margin-bottom:5px; }

  @media (max-width:900px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} .grid-2{grid-template-columns:1fr} .sidebar{display:none} }

  /* --- Revenue model --- */
  .rev-row { display:flex; align-items:center; gap:16px; padding:14px; border:1px solid var(--border-subtle); border-radius:12px; margin-bottom:10px; background:var(--surface-inner); }
  .rev-bar-wrap { width:100%; height:6px; background:var(--border-subtle); border-radius:3px; overflow:hidden; margin-top:8px; }
  .rev-bar { height:100%; background:linear-gradient(90deg,var(--cyan-tech),var(--emerald)); border-radius:3px; }
  .rev-name { font-size:13px; font-weight:800; }
  .rev-desc { font-size:11px; color:var(--text-muted); margin-top:3px; line-height:1.6; }
  .rev-model { font-size:10.5px; color:var(--cyan-soft); margin-top:5px; }
  .rev-amt { font-size:15px; font-weight:800; color:var(--emerald); white-space:nowrap; text-align:left; }
  .rev-share { font-size:10px; color:var(--text-muted); text-align:left; margin-top:2px; }

  .ue-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .ue-card { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:12px; padding:15px; }
  .ue-label { font-size:10.5px; color:var(--text-muted); line-height:1.5; min-height:30px; }
  .ue-value { font-size:19px; font-weight:800; margin-top:8px; }
  .ue-value.ok { color:var(--emerald); }

  /* --- Roadmap --- */
  .roadmap-track { position:relative; padding-right:28px; }
  .roadmap-track::before { content:""; position:absolute; right:8px; top:6px; bottom:6px; width:2px; background:var(--border-subtle); }
  .rm-phase { position:relative; margin-bottom:22px; }
  .rm-phase::before { content:""; position:absolute; right:-28px; top:3px; width:14px; height:14px; border-radius:50%; border:3px solid var(--bg-dark); }
  .rm-phase.done::before { background:var(--emerald); }
  .rm-phase.active::before { background:var(--cyan-tech); box-shadow:0 0 0 4px rgba(0,180,216,.2); }
  .rm-phase.next::before { background:var(--gold); }
  .rm-phase.future::before { background:var(--border-subtle); }
  .rm-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .rm-title { font-size:13.5px; font-weight:800; }
  .rm-period { font-size:10.5px; color:var(--text-muted); }
  .rm-items { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:12px 14px; }
  .rm-items li { font-size:11.5px; color:#D8E2EC; margin-bottom:6px; line-height:1.6; }
  .rm-items li:last-child { margin-bottom:0; }

  /* --- Incident log / circuit breaker case study --- */
  .incident-card { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:12px; padding:14px; margin-bottom:10px; }
  .incident-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .incident-title { font-size:12.5px; font-weight:800; }
  .incident-date { font-size:10px; color:var(--text-muted); }
  .incident-row { display:flex; gap:8px; font-size:11px; margin-bottom:5px; line-height:1.6; }
  .incident-row .k { color:var(--text-muted); white-space:nowrap; flex-shrink:0; min-width:90px; }
</style>
</head>

        <span class="tab-pill ${state.finReqFilter==='قيد المراجعة'?'active':''}" onclick="state.finReqFilter='قيد المراجعة';render()">قيد المراجعة</span>
        <span class="tab-pill ${state.finReqFilter==='موافَق'?'active':''}" onclick="state.finReqFilter='موافَق';render()">موافَق عليها</span>
        <span class="tab-pill ${state.finReqFilter==='مرفوض'?'active':''}" onclick="state.finReqFilter='مرفوض';render()">مرفوضة</span>
      </div>
      <div class="table-wrapper"><table><thead><tr><th>رقم الطلب</th><th>المستخدم</th><th>البنك</th><th>نوع التمويل</th><th>المبلغ</th><th>تاريخ التقديم</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>
      ${filtered.map((r)=>{ const i = financingRequests.indexOf(r); return `<tr>
        <td><code>${r.id}</code></td><td>${r.user}</td><td>${r.bank}</td><td>${r.type}</td><td>${r.amount}</td><td>${r.submitted}</td><td>${reqBadge(r.status)}</td>
        <td>
          <button class="btn btn-approve btn-sm" ${r.status==='موافَق'?'disabled':''} onclick="setReqStatus(${i},'موافَق')">${ICONS.check.replace('width="24" height="24"','width="11" height="11"')} قبول</button>
          <button class="btn btn-reject btn-sm" ${r.status==='مرفوض'?'disabled':''} onclick="setReqStatus(${i},'مرفوض')">رفض</button>
        </td>
      </tr>`; }).join('')}
      </tbody></table></div>
    </div>

    <div class="panel">
      <h2>${ICONS.bank} اتفاقيات التمويل النشطة مع البنوك</h2>
      <p class="panel-note">بنود التمويل الفعلية الموقعة مع كل مزود، ونطاق الأنظمة التي تحكمها.</p>
      <div class="table-wrapper"><table><thead><tr><th>البنك / المزود</th><th>نوع التسهيل</th><th>الحد</th><th>نسبة الاستخدام</th><th>تاريخ التوقيع</th><th>التجديد</th><th>الحالة</th></tr></thead><tbody>
      ${financingAgreements.map(f=>`<tr>
        <td>${f.bank}<div>${f.regs.map(r=>`<span class="reg-tag">${r}</span>`).join('')}</div></td>
        <td>${f.type}</td><td>${f.limit}</td><td>${f.utilization}</td><td>${f.signed}</td><td>${f.renewal}</td>
        <td><span class="badge ${f.status==='نشط'?'badge-ok':f.status==='قيد التجديد'?'badge-half':'badge-pending'}">${f.status}</span></td>
      </tr>`).join('')}
      </tbody></table></div>
    </div>`;
}

function renderSamaReports(){
  return `
    <div class="header-row"><div><h1>تقارير ساما التنظيمية</h1><p>التقارير الدورية المقدَّمة إلى البنك المركزي السعودي (SAMA)</p></div>
      <span class="env-pill">SAMA Regulatory</span></div>
    <div class="panel">
      <h2>${ICONS.fileCheck} التقارير التنظيمية الدورية</h2>
      <p class="panel-note">تُقدَّم هذه التقارير إلى البنك المركزي السعودي (ساما) وفق إطار المصرفية المفتوحة ولوائح مكافحة غسل الأموال.</p>
      ${samaReports.map(r=>`
        <div class="doc-row">
          <div>
            <div class="name">${r.name}</div>
            <div class="meta">التكرار: ${r.freq} · آخر تقديم: ${r.last} · الموعد القادم: ${r.next}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            ${reportBadge(r.status)}
            <button class="btn btn-ghost btn-sm">${ICONS.download} تنزيل</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="panel">
      <h2>${ICONS.scale} متطلبات الامتثال الأساسية</h2>
      <div class="settings-row"><span>إطار المصرفية المفتوحة (Open Banking Framework)</span><span class="badge badge-ok">مطابق</span></div>
      <div class="settings-row"><span>مكافحة غسل الأموال وتمويل الإرهاب (AML/CFT)</span><span class="badge badge-ok">مطابق</span></div>
      <div class="settings-row"><span>حماية بيانات المستهلك المالي</span><span class="badge badge-ok">مطابق</span></div>
      <div class="settings-row"><span>إقامة البيانات داخل المملكة (Data Residency)</span><span class="badge badge-ok">مطابق</span></div>
      <div class="settings-row"><span>كفاية رأس المال لأنشطة التمويل الاستهلاكي</span><span class="badge badge-half">قيد المراجعة</span></div>
    </div>

    <div class="panel">
      <h2>${ICONS.shield} حالة الامتثال الحي (Live Compliance Status)</h2>
      <p class="panel-note">مؤشرات حية على جاهزية النظام الأمني والتنظيمي، محدّثة لحظياً من أنظمة المراقبة الداخلية.</p>
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi-card"><p class="kpi-label">نسبة العمليات المدقَّقة آلياً</p><p class="kpi-value" style="color:var(--emerald);font-size:17px">100%</p><p class="kpi-note" style="color:var(--text-muted)">كل عملية تُسجَّل بدفتر Append-Only</p></div>
        <div class="kpi-card"><p class="kpi-label">حالة شهادات mTLS مع البنوك</p><p class="kpi-value" style="color:var(--emerald);font-size:17px">سارية</p><p class="kpi-note" style="color:var(--text-muted)">آخر تجديد: 1 يناير 2026</p></div>
        <div class="kpi-card"><p class="kpi-label">آخر تدقيق أمني خارجي (Pen Test)</p><p class="kpi-value" style="font-size:17px">18 ديسمبر 2025</p><p class="kpi-note" style="color:var(--cyan-tech)">القادم: مارس 2026</p></div>
        <div class="kpi-card"><p class="kpi-label">حوادث تسريب بيانات مسجَّلة</p><p class="kpi-value" style="color:var(--emerald);font-size:17px">0</p><p class="kpi-note" style="color:var(--text-muted)">منذ بدء التشغيل التجريبي</p></div>
      </div>
    </div>`;
}

function renderKycReview(){
  return `
    <div class="header-row"><div><h1>مراجعة اعرف عميلك (KYC)</h1><p>قائمة انتظار المراجعة وفق سياسة مكافحة غسل الأموال</p></div>
      <span class="env-pill">SAMA Regulatory</span></div>
    <div class="panel">
      <h2>${ICONS.idCard} قائمة انتظار مراجعة اعرف عميلك (KYC)</h2>
      <p class="panel-note">طلبات KYC الواردة من التطبيق، مع تصنيف المخاطر وفق سياسة مكافحة غسل الأموال.</p>
      <div class="table-wrapper"><table><thead><tr><th>المستخدم</th><th>تاريخ التقديم</th><th>تصنيف المخاطر</th><th>PEP</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>
      ${kycQueue.map((k,i)=>`<tr>
        <td>${k.user}</td><td>${k.submitted}</td>
        <td><span class="badge ${k.risk==='منخفض'?'badge-ok':'badge-half'}">${k.risk}</span></td>
        <td>${k.pep}</td>
        <td>${kycBadge(k.status)}</td>
        <td>
          <button class="btn btn-approve btn-sm" ${k.status==='موافَق'?'disabled':''} onclick="setKycStatus(${i},'موافَق')">${ICONS.check.replace('width="24" height="24"','width="11" height="11"')} قبول</button>
          <button class="btn btn-reject btn-sm" ${k.status==='مرفوض'?'disabled':''} onclick="setKycStatus(${i},'مرفوض')">رفض</button>
        </td>
      </tr>`).join('')}
      </tbody></table></div>
    </div>`;
}

function renderSettings(){
  return `
    <div class="header-row"><div><h1>الإعدادات</h1><p>تفضيلات لوحة الإدارة والتنبيهات</p></div></div>
    <div class="panel" style="max-width:560px">
      <h2>${ICONS.settings} عام</h2>
      <div class="settings-row"><span style="display:flex;align-items:center;gap:8px">${ICONS.moon} المظهر الداكن</span><button class="toggle on"><span class="knob"></span></button></div>
      <div class="settings-row"><span>تنبيهات البريد الإلكتروني للأعطال الحرجة</span><button class="toggle on"><span class="knob"></span></button></div>
      <div class="settings-row"><span>تقرير أسبوعي عبر البريد</span><button class="toggle off"><span class="knob"></span></button></div>
      <div class="settings-row"><span>وضع الصيانة (يوقف عمليات جديدة مؤقتاً)</span><button class="toggle off"><span class="knob"></span></button></div>
    </div>`;
}

function render(){
  document.getElementById('sideBrand').innerHTML = `${logoSVG(34,15)}<span>NEXIOS<span class="dot">.</span> FINANCE</span>`;
  document.getElementById('navItems').innerHTML = NAV.map(n=>`${n.sectionLabel?`<div class="nav-section">${n.sectionLabel}</div>`:''}<div class="nav-item ${state.page===n.key?'active':''}" onclick="setPage('${n.key}')">${ICONS[n.icon]}<span>${n.label}</span></div>`).join('');
  let html='';
  if(state.page==='dashboard') html=renderDashboard();
  else if(state.page==='users') html=renderUsers();
  else if(state.page==='banks') html=renderBanks();
  else if(state.page==='transactions') html=renderTransactions();
  else if(state.page==='revenue') html=renderRevenue();
  else if(state.page==='roadmap') html=renderRoadmap();
  else if(state.page==='financing') html=renderFinancing();
  else if(state.page==='sama-reports') html=renderSamaReports();
  else if(state.page==='kyc-review') html=renderKycReview();
  else html=renderSettings();
  document.getElementById('main').innerHTML = html;
}
render();
</script>
</body>
</html>
