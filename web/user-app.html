<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXIOS. FINANCE — نسخة المستخدم</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg-dark:#03060D; --navy-deep:#0B192C; --emerald:#00E676; --cyan-tech:#00B4D8; --cyan-soft:#48CAE4;
    --gold:#D4AF37; --danger:#FF5252; --surface-card:#091322; --surface-inner:#050B14;
    --border-subtle:#152742; --text-muted:#8FA0B5; --ink-soft:#7C93A6;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg-dark); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Arabic',sans-serif;
    display:flex; justify-content:center; padding:30px 10px; min-height:100vh;
  }
  .sim-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .sim-label { font-size:11px; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; }

  .phone { width:375px; height:790px; background:#07101e; border:7px solid #1a2f4c; border-radius:44px; padding:14px; box-shadow:0 30px 70px rgba(0,0,0,.85); position:relative; }
  .phone::before { content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:24px; background:#07101e; border-radius:0 0 16px 16px; z-index:20; }
  .screen { width:100%; height:100%; background:var(--navy-deep); border-radius:32px; overflow:hidden; position:relative; display:flex; flex-direction:column; }

  #splash { position:absolute; inset:0; z-index:50; background:radial-gradient(circle at 50% 30%, #0c1e36 0%, #03060D 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; animation:fadeOut .6s ease 2.1s forwards; }
  @keyframes fadeOut { to { opacity:0; visibility:hidden; pointer-events:none; } }
  .logo-main-text { font-size:30px; font-weight:900; letter-spacing:1.5px; color:#fff; }
  .logo-main-text .dot { color:var(--emerald); }
  .logo-sub-text { font-size:19px; font-weight:800; letter-spacing:5px; color:#fff; margin-top:-4px; }
  .logo-tagline { font-size:9.5px; font-weight:600; letter-spacing:2.5px; color:var(--text-muted); margin-top:8px; text-transform:uppercase; }
  #splash .dot-pulse { position:absolute; bottom:55px; width:6px; height:6px; border-radius:50%; background:var(--emerald); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }

  .brand-strip { background:#07101e; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 0; flex-shrink:0; }
  .brand-strip span { font-size:12px; font-weight:800; letter-spacing:.5px; }
  .brand-strip .dot { color:var(--emerald); }

  .content { flex:1; overflow-y:auto; scrollbar-width:none; padding:16px 14px; }
  .content::-webkit-scrollbar{display:none}

  .page-title { font-size:15px; font-weight:800; margin:2px 0 4px; }
  .page-sub { font-size:11px; color:var(--text-muted); margin:0 0 14px; }

  .hero-box { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:16px; padding:16px; margin-bottom:14px; }
  .hero-label { font-size:11px; color:var(--text-muted); }
  .hero-value { font-size:23px; font-weight:800; color:#fff; margin:4px 0 0; }
  .split-bar { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:10px; }
  .legend-row { display:flex; gap:14px; margin-top:8px; font-size:9.5px; color:var(--text-muted); }
  .legend-row .dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-left:4px; }

  .source-row { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:11px; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center; }
  .source-name { font-size:12px; font-weight:700; }
  .source-meta { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .source-amt { font-size:11.5px; font-weight:800; color:var(--emerald); }

  .priority-row { background:var(--surface-inner); border-radius:10px; padding:11px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .priority-name { font-size:12px; font-weight:700; }
  .priority-meta { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .grip { color:var(--text-muted); background:none; border:none; padding:6px; cursor:pointer; }
  .grip svg { width:15px; height:15px; }

  .slider-box { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; margin-top:16px; }
  .slider-top { display:flex; justify-content:space-between; font-size:11px; font-weight:700; }
  .slider-top .val { color:var(--emerald); }
  input[type=range] { width:100%; margin-top:8px; accent-color:var(--emerald); }

  .cards-scroll { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; margin:0 -14px; padding-inline:14px; }
  .cards-scroll::-webkit-scrollbar{display:none}
  .p-card { min-width:280px; height:172px; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; scroll-snap-align:start; box-shadow:0 18px 34px rgba(0,0,0,.7); border:1px solid rgba(255,255,255,.1); }
  .pc-platinum { background:linear-gradient(135deg,#1f3352,#08101d); border-color:rgba(0,180,216,.5); }
  .pc-infinite { background:radial-gradient(circle at 85% 15%,#0f362e,#051417); border-color:rgba(0,230,118,.55); }
  .pc-private { background:radial-gradient(circle at 85% 15%,#2d251a,#070708); border-color:rgba(212,175,55,.55); }
  .pc-carbon { background:repeating-linear-gradient(45deg,#0d0f12,#0d0f12 5px,#161a22 5px,#161a22 10px); border-color:rgba(0,230,118,.6); }
  .pc-top { display:flex; justify-content:space-between; align-items:center; }
  .pc-chip { width:34px; height:25px; background:linear-gradient(135deg,#d4af37,#aa820a); border-radius:5px; border:1px solid #775c04; }
  .pc-bottom { display:flex; justify-content:space-between; align-items:flex-end; }
  .pc-holder-label { font-size:8px; color:var(--text-muted); }
  .pc-holder { font-size:12px; font-weight:800; letter-spacing:.5px; }
  .pc-name { font-size:9.5px; font-weight:600; margin-top:2px; }
  .pc-badge { font-size:8px; padding:2px 7px; border-radius:9px; font-weight:800; }
  .mc-circles { display:flex; } .mc-circles span { width:16px; height:16px; border-radius:50%; display:inline-block; }
  .mc-circles span:first-child{background:#EB001B;opacity:.9} .mc-circles span:last-child{background:#F79E1B;margin-right:-6px;opacity:.9}

  .receipt-box { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; }
  .receipt-check { width:34px; height:34px; border-radius:50%; background:rgba(0,230,118,.18); color:var(--emerald); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; }
  .receipt-check svg { width:17px; height:17px; }
  .receipt-status { font-size:11.5px; color:var(--emerald); font-weight:700; }
  .receipt-amount { font-size:21px; font-weight:900; margin:5px 0; }
  .receipt-merchant { font-size:10.5px; color:var(--text-muted); }
  .breakdown-box { background:var(--bg-dark); border:1px dashed var(--border-subtle); border-radius:9px; padding:10px; margin:12px 0 0; font-size:11px; text-align:right; }
  .breakdown-title { font-weight:700; color:var(--cyan-tech); margin-bottom:6px; }
  .breakdown-row { display:flex; justify-content:space-between; margin-bottom:4px; }
  .breakdown-row .muted { color:var(--text-muted); }

  .transfer-item { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:11px; margin-bottom:8px; }
  .tr-top { display:flex; justify-content:space-between; align-items:center; }
  .pill { font-size:9px; padding:2px 8px; border-radius:99px; font-weight:700; }
  .pill-ok { background:rgba(0,230,118,.15); color:var(--emerald); }
  .pill-pending { background:rgba(0,180,216,.15); color:var(--cyan-tech); }

  .perm-item { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:11px; margin-bottom:8px; }
  .perm-top { display:flex; justify-content:space-between; font-weight:700; font-size:11.5px; }
  .perm-status { color:var(--emerald); }
  .perm-meta { font-size:10px; color:var(--text-muted); margin-top:3px; }

  .revoke-btn { background:rgba(255,82,82,.15); border:1px solid var(--danger); color:var(--danger); padding:11px; border-radius:9px; font-size:11.5px; font-weight:700; width:100%; margin-top:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .revoke-btn svg { width:14px; height:14px; }

  .settings-item { display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--border-subtle); }
  .settings-item:last-child { border-bottom:none; }
  .settings-item .ic { width:30px; height:30px; border-radius:9px; background:var(--surface-inner); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .settings-item .ic svg { width:15px; height:15px; }
  .settings-item span.lbl { font-size:12px; font-weight:600; }
  .settings-item .chev { margin-right:auto; }

  .toggle { width:40px; height:23px; border-radius:99px; position:relative; border:none; cursor:pointer; }
  .toggle.on { background:var(--cyan-tech); } .toggle.off { background:var(--border-subtle); }
  .knob { position:absolute; top:2px; width:19px; height:19px; border-radius:50%; background:#fff; transition:.15s; }
  .toggle.on .knob { right:2px; } .toggle.off .knob { left:2px; }

  .tabbar { position:absolute; bottom:0; left:0; right:0; background:#07101e; border-top:1px solid var(--border-subtle); display:flex; padding:8px 4px; z-index:10; }
  .tab-btn { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:12px; cursor:pointer; }
  .tab-btn svg { width:18px; height:18px; color:var(--text-muted); }
  .tab-btn span { font-size:8.5px; color:var(--text-muted); font-weight:700; }
  .tab-btn.active svg, .tab-btn.active span { color:var(--emerald); }

  .spacer { height:20px; }
</style>
</head>
<body>
<div class="sim-wrap">
  <div class="sim-label">محاكي الجوال — نسخة المستخدم</div>
  <div class="phone">
    <div class="screen">
      <div id="splash">
        <div id="splashLogo"></div>
        <div class="logo-main-text">NEXIOS<span class="dot">.</span></div>
        <div class="logo-sub-text">FINANCE</div>
        <div class="logo-tagline">INTEGRATED FINANCE SOLUTIONS</div>
        <div class="dot-pulse"></div>
      </div>
      <div class="brand-strip" id="brandStrip"></div>
      <div class="content" id="content"></div>
      <div class="tabbar" id="tabbar"></div>
    </div>
  </div>
</div>

<script>
const ic = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const ICONS = {
  home: ic(`<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>`),
  layers: ic(`<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>`),
  cards: ic(`<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/>`),
  receipt: ic(`<path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6"/><path d="M9 12h6"/>`),
  settings: ic(`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/>`),
  grip: ic(`<circle cx="8" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="18" r="1.3" fill="currentColor" stroke="none"/>`),
  check: ic(`<path d="M20 6 9 17l-5-5"/>`),
  lockClosed: ic(`<rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>`),
  arrowUpDown: ic(`<path d="M8 3v14"/><path d="M4 13l4 4 4-4"/><path d="M16 21V7"/><path d="M20 11l-4-4-4 4"/>`),
  moon: ic(`<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>`),
  globe: ic(`<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>`),
  fingerprint: ic(`<path d="M12 3a7 7 0 0 0-7 7c0 3 1 5 1 7"/><path d="M12 3a7 7 0 0 1 7 7c0 4-1 6-1 8"/><path d="M9 10a3 3 0 0 1 6 0c0 5 1 7 2 9"/><path d="M7 15c0-3-.5-4-.5-5"/><path d="M12 10v3c0 4 1 6 3 8"/>`),
  user: ic(`<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>`),
  logout: ic(`<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>`),
  chevronLeft: ic(`<path d="M15 18l-6-6 6-6"/>`),
  plus: ic(`<path d="M12 5v14M5 12h14"/>`),
};

function logoSVG(w,h){
  return `<svg width="${w}" height="${h}" viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 18 H70 C85 18 95 45 110 45" stroke="#00E676" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M10 36 H70 C85 36 95 45 110 45" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M10 54 H70 C85 54 95 45 110 45" stroke="#48CAE4" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M10 72 H70 C85 72 95 45 110 45" stroke="#00B4D8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="112" cy="45" r="14" fill="#091322" stroke="#00E676" stroke-width="3"/>
    <circle cx="112" cy="45" r="7" fill="#00E676"/>
    <path d="M119 45 H155" stroke="#00E676" stroke-width="9" stroke-linecap="round"/>
    <polygon points="150,30 175,45 150,60" fill="#00E676"/>
  </svg>`;
}
function cardLogoSVG(c1,c2,c3,fill,w=48,h=22){
  return `<svg width="${w}" height="${h}" viewBox="0 0 220 90" fill="none">
    <path d="M10 18 H70 C85 18 95 45 110 45" stroke="${c1}" stroke-width="12" stroke-linecap="round"/>
    <path d="M10 45 H70 C85 45 95 45 110 45" stroke="${c2}" stroke-width="12" stroke-linecap="round"/>
    <path d="M10 72 H70 C85 72 95 45 110 45" stroke="${c3}" stroke-width="12" stroke-linecap="round"/>
    <circle cx="112" cy="45" r="16" fill="${fill}"/>
    <polygon points="125,25 165,45 125,65" fill="${fill}"/>
  </svg>`;
}

const fmt = (n) => new Intl.NumberFormat('ar-SA', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n);

let state = {
  tab: 'home',
  priorities: [
    { id:1, name:'الحساب الجاري الأساسي', meta:'استهلاك كامل الرصيد أولاً', color:'var(--emerald)' },
    { id:2, name:'صندوق المرابحة والسيولة', meta:'تسييل لتغطية الفارق فقط', color:'var(--cyan-tech)' },
    { id:3, name:'بطاقة احتياطية (فيزا)', meta:'آخر مصدر عند الحاجة', color:'var(--gold)' },
  ],
  safetyFloor: 5000,
  banks: [
    { name:'تفويض بنك الراجحي (VRP)', meta:'السقف اليومي للسحب: 5,000 ر.س', active:true },
    { name:'تفويض منصة التداول الاستثمارية', meta:'أوامر بيع لحظية لتغطية الفارق', active:true },
    { name:'بنك الرياض', meta:'غير مربوط بعد', active:false },
  ],
  theme: 'dark',
};

function setTab(t){ state.tab = t; render(); }
function moveP(id,dir){
  const idx = state.priorities.findIndex(p=>p.id===id);
  const t = idx+dir; if(t<0||t>=state.priorities.length) return;
  [state.priorities[idx], state.priorities[t]] = [state.priorities[t], state.priorities[idx]];
  render();
}
function toggleBank(i){ state.banks[i].active = !state.banks[i].active; render(); }
function setFloor(v){ state.safetyFloor = v; document.getElementById('floorVal').textContent = fmt(v)+' ر.س'; }

function renderHome(){
  return `
    <p class="page-title">لوحة الأصول الموحدة</p>
    <p class="page-sub">القوة الشرائية الحية المجمّعة من كل مصادرك</p>
    <div class="hero-box">
      <span class="hero-label">إجمالي القوة الشرائية المتاحة</span>
      <div class="hero-value">48,350.00 <span style="font-size:12px;font-weight:600">ر.س</span></div>
      <div class="split-bar">
        <div style="width:20%;background:var(--cyan-tech)"></div>
        <div style="width:65%;background:var(--emerald)"></div>
        <div style="width:15%;background:#FFD700"></div>
      </div>
      <div class="legend-row">
        <span><span class="dot" style="background:var(--cyan-tech)"></span>كاش جاري</span>
        <span><span class="dot" style="background:var(--emerald)"></span>صناديق استثمار</span>
        <span><span class="dot" style="background:#FFD700"></span>ذهب وأصول</span>
      </div>
    </div>
    <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px">المصادر المربوطة حياً (Open Banking):</p>
    <div class="source-row"><div><div class="source-name">بنك الراجحي (جاري)</div><div class="source-meta">SA03 •••• 1016</div></div><span class="source-amt">400.00 ر.س</span></div>
    <div class="source-row"><div><div class="source-name">صندوق دراية للسيولة</div><div class="source-meta">تسييل فوري T+0</div></div><span class="source-amt">31,427.00 ر.س</span></div>
    <div class="source-row"><div><div class="source-name">حساب التوفير</div><div class="source-meta">بنك الراجحي</div></div><span class="source-amt">12,500.00 ر.س</span></div>
    <div class="source-row"><div><div class="source-name">بطاقة احتياطية (فيزا)</div><div class="source-meta">بنك الأول</div></div><span class="source-amt">6,000.00 ر.س</span></div>
    <div class="spacer"></div>`;
}

function renderPriority(){
  let h = `<p class="page-title">مصفوفة أولوية التسييل</p><p class="page-sub">ترتيب مسارات التغطية التلقائية عند الشراء</p>`;
  state.priorities.forEach((p,i)=>{
    h += `<div class="priority-row" style="border-right:4px solid ${p.color}">
      <div><div class="priority-name">${i+1}. ${p.name}</div><div class="priority-meta">${p.meta}</div></div>
      <button class="grip" onclick="moveP(${p.id},${i===0?1:-1})">${ICONS.grip}</button>
    </div>`;
  });
  h += `<div class="slider-box">
      <div class="slider-top"><span>قفل الأمان الأدنى (Safety Floor)</span><span class="val" id="floorVal">${fmt(state.safetyFloor)} ر.س</span></div>
      <input type="range" min="0" max="20000" step="500" value="${state.safetyFloor}" oninput="setFloor(this.value)">
    </div>
    <p style="font-size:10.5px;color:var(--text-muted);margin-top:10px;line-height:1.6">يمنع النظام التسييل التلقائي من صندوق الاستثمار إذا انخفض رصيده عن هذا الحد.</p>
    <div class="spacer"></div>`;
  return h;
}

function renderCards(){
  let h = `<p class="page-title">بطاقات نكسيوس</p><p class="page-sub">بطاقاتك الفعلية المرتبطة بالمنظومة</p>
    <div class="cards-scroll">
      <div class="p-card pc-platinum">
        <div class="pc-top">

    h += `<div class="perm-item">
      <div class="perm-top"><span>${b.name}</span><span class="${b.active?'perm-status':''}" style="color:${b.active?'var(--emerald)':'var(--text-muted)'};cursor:pointer" onclick="toggleBank(${i})">${b.active?'نشط':'إيقاف'}</span></div>
      <div class="perm-meta">${b.meta}</div>
    </div>`;
  });
  h += `<button class="revoke-btn">${ICONS.lockClosed} إلغاء جميع التفويضات وقطع الاتصال فوراً</button>
    <p style="font-size:11px;color:var(--text-muted);margin:20px 0 8px;font-weight:700">تفضيلات التطبيق</p>

    <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:0 10px">
      <div class="settings-item"><div class="ic">${ICONS.user}</div><span class="lbl">الملف الشخصي — HAMAD</span><span class="chev">${ICONS.chevronLeft.replace('width="24" height="24"','width="13" height="13"')}</span></div>

const TABS = [
  { key:'home', label:'الرئيسية', icon:'home' },
  { key:'priority', label:'الأولويات', icon:'layers' },
  { key:'cards', label:'البطاقات', icon:'cards' },
  { key:'activity', label:'العمليات', icon:'receipt' },
  { key:'settings', label:'الإعدادات', icon:'settings' },
];

function render(){
  document.getElementById('brandStrip').innerHTML = `${logoSVG(30,13)}<span>NEXIOS<span class="dot">.</span> FINANCE</span>`;
  let body='';
  if(state.tab==='home') body = renderHome();
  else if(state.tab==='priority') body = renderPriority();
  else if(state.tab==='cards') body = renderCards();
  else if(state.tab==='activity') body = renderActivity();
  else body = renderSettings();
  document.getElementById('content').innerHTML = body;
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`
    <button class="tab-btn ${state.tab===t.key?'active':''}" onclick="setTab('${t.key}')">${ICONS[t.icon]}<span>${t.label}</span></button>
  `).join('');
}

document.getElementById('splashLogo').innerHTML = logoSVG(190,78);
render();
