<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXIOS. FINANCE — نسخة المستخدم</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg-dark:#03060D; --navy-deep:#0B192C; --emerald:#00E676; --cyan-tech:#00B4D8; --cyan-soft:#48CAE4;
    --gold:#D4AF37; --danger:#FF5252; --surface-card:#091322; --surface-inner:#050B14;
    --border-subtle:#152742; --text-muted:#8FA0B5; --ink-soft:#7C93A6;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg-dark); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Arabic',sans-serif;
    display:flex; justify-content:center; padding:30px 10px; min-height:100vh;
  }
  .sim-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .sim-label { font-size:11px; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; }

  .phone { width:375px; height:790px; background:#07101e; border:7px solid #1a2f4c; border-radius:44px; padding:14px; box-shadow:0 30px 70px rgba(0,0,0,.85); position:relative; }
  .phone::before { content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:24px; background:#07101e; border-radius:0 0 16px 16px; z-index:20; }
  .screen { width:100%; height:100%; background:var(--navy-deep); border-radius:32px; overflow:hidden; position:relative; display:flex; flex-direction:column; }

  #splash { position:absolute; inset:0; z-index:50; background:radial-gradient(circle at 50% 30%, #0c1e36 0%, #03060D 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; animation:fadeOut .6s ease 2.1s forwards; }
  @keyframes fadeOut { to { opacity:0; visibility:hidden; pointer-events:none; } }
  .logo-main-text { font-size:30px; font-weight:900; letter-spacing:1.5px; color:#fff; }
  .logo-main-text .dot { color:var(--emerald); }
  .logo-sub-text { font-size:19px; font-weight:800; letter-spacing:5px; color:#fff; margin-top:-4px; }
  .logo-tagline { font-size:9.5px; font-weight:600; letter-spacing:2.5px; color:var(--text-muted); margin-top:8px; text-transform:uppercase; }
  #splash .dot-pulse { position:absolute; bottom:55px; width:6px; height:6px; border-radius:50%; background:var(--emerald); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }

  .brand-strip { background:#07101e; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 0; flex-shrink:0; position:relative; }
  .brand-strip span { font-size:12px; font-weight:800; letter-spacing:.5px; }
  .brand-strip .dot { color:var(--emerald); }
  .brand-back { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:#fff; display:flex; align-items:center; gap:4px; font-size:11px; cursor:pointer; }
  .brand-back svg { width:15px; height:15px; }

  .content { flex:1; overflow-y:auto; scrollbar-width:none; padding:16px 14px; }
  .content::-webkit-scrollbar{display:none}

  .page-title { font-size:15px; font-weight:800; margin:2px 0 4px; }
  .page-sub { font-size:11px; color:var(--text-muted); margin:0 0 14px; }

  .hero-box { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:16px; padding:16px; margin-bottom:14px; }
  .hero-label { font-size:11px; color:var(--text-muted); }
  .hero-value { font-size:23px; font-weight:800; color:#fff; margin:4px 0 0; }
  .split-bar { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:10px; }
  .legend-row { display:flex; gap:14px; margin-top:8px; font-size:9.5px; color:var(--text-muted); flex-wrap:wrap; }
  .legend-row .dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-left:4px; }

  .source-row { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:11px; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .source-name { font-size:12px; font-weight:700; }
  .source-meta { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .source-amt { font-size:11.5px; font-weight:800; color:var(--emerald); }

  .priority-row { background:var(--surface-inner); border-radius:10px; padding:11px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .priority-name { font-size:12px; font-weight:700; }
  .priority-meta { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .grip { color:var(--text-muted); background:none; border:none; padding:6px; cursor:pointer; }
  .grip svg { width:15px; height:15px; }

  .slider-box { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; margin-top:16px; }
  .slider-top { display:flex; justify-content:space-between; font-size:11px; font-weight:700; }
  .slider-top .val { color:var(--emerald); }
  input[type=range] { width:100%; margin-top:8px; accent-color:var(--emerald); }

  .cards-scroll { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; margin:0 -14px; padding-inline:14px; }
  .cards-scroll::-webkit-scrollbar{display:none}
  .p-card { min-width:280px; height:172px; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; scroll-snap-align:start; box-shadow:0 18px 34px rgba(0,0,0,.7); border:1px solid rgba(255,255,255,.1); }
  .pc-platinum { background:linear-gradient(135deg,#1f3352,#08101d); border-color:rgba(0,180,216,.5); }
  .pc-infinite { background:radial-gradient(circle at 85% 15%,#0f362e,#051417); border-color:rgba(0,230,118,.55); }
  .pc-private { background:radial-gradient(circle at 85% 15%,#2d251a,#070708); border-color:rgba(212,175,55,.55); }
  .pc-carbon { background:repeating-linear-gradient(45deg,#0d0f12,#0d0f12 5px,#161a22 5px,#161a22 10px); border-color:rgba(0,230,118,.6); }
  .pc-top { display:flex; justify-content:space-between; align-items:center; }
  .pc-chip { width:34px; height:25px; background:linear-gradient(135deg,#d4af37,#aa820a); border-radius:5px; border:1px solid #775c04; }
  .pc-bottom { display:flex; justify-content:space-between; align-items:flex-end; }
  .pc-holder-label { font-size:8px; color:var(--text-muted); }
  .pc-holder { font-size:12px; font-weight:800; letter-spacing:.5px; }
  .pc-name { font-size:9.5px; font-weight:600; margin-top:2px; }
  .pc-badge { font-size:8px; padding:2px 7px; border-radius:9px; font-weight:800; }
  .mc-circles { display:flex; } .mc-circles span { width:16px; height:16px; border-radius:50%; display:inline-block; }
  .mc-circles span:first-child{background:#EB001B;opacity:.9} .mc-circles span:last-child{background:#F79E1B;margin-right:-6px;opacity:.9}

  .receipt-box { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; }
  .receipt-check { width:34px; height:34px; border-radius:50%; background:rgba(0,230,118,.18); color:var(--emerald); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; }
  .receipt-check svg { width:17px; height:17px; }
  .receipt-status { font-size:11.5px; color:var(--emerald); font-weight:700; }
  .receipt-amount { font-size:21px; font-weight:900; margin:5px 0; }
  .receipt-merchant { font-size:10.5px; color:var(--text-muted); }
  .breakdown-box { background:var(--bg-dark); border:1px dashed var(--border-subtle); border-radius:9px; padding:10px; margin:12px 0 0; font-size:11px; text-align:right; }
  .breakdown-title { font-weight:700; color:var(--cyan-tech); margin-bottom:6px; }
  .breakdown-row { display:flex; justify-content:space-between; margin-bottom:4px; }
  .breakdown-row .muted { color:var(--text-muted); }

  .transfer-item { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:11px; margin-bottom:8px; }
  .tr-top { display:flex; justify-content:space-between; align-items:center; }
  .pill { font-size:9px; padding:2px 8px; border-radius:99px; font-weight:700; }
  .pill-ok { background:rgba(0,230,118,.15); color:var(--emerald); }
  .pill-pending { background:rgba(0,180,216,.15); color:var(--cyan-tech); }
  .pill-warn { background:rgba(212,175,55,.15); color:var(--gold); }
  .pill-danger { background:rgba(255,82,82,.15); color:var(--danger); }

  .perm-item { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:11px; margin-bottom:8px; }
  .perm-top { display:flex; justify-content:space-between; font-weight:700; font-size:11.5px; }
  .perm-status { color:var(--emerald); }
  .perm-meta { font-size:10px; color:var(--text-muted); margin-top:3px; }

  .revoke-btn { background:rgba(255,82,82,.15); border:1px solid var(--danger); color:var(--danger); padding:11px; border-radius:9px; font-size:11.5px; font-weight:700; width:100%; margin-top:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .revoke-btn svg { width:14px; height:14px; }

  .settings-item { display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--border-subtle); cursor:pointer; }
  .settings-item:last-child { border-bottom:none; }
  .settings-item .ic { width:30px; height:30px; border-radius:9px; background:var(--surface-inner); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .settings-item .ic svg { width:15px; height:15px; }
  .settings-item span.lbl { font-size:12px; font-weight:600; }
  .settings-item .chev { margin-right:auto; }

  .toggle { width:40px; height:23px; border-radius:99px; position:relative; border:none; cursor:pointer; }
  .toggle.on { background:var(--cyan-tech); } .toggle.off { background:var(--border-subtle); }
  .knob { position:absolute; top:2px; width:19px; height:19px; border-radius:50%; background:#fff; transition:.15s; }
  .toggle.on .knob { right:2px; } .toggle.off .knob { left:2px; }

  .tabbar { position:absolute; bottom:0; left:0; right:0; background:#07101e; border-top:1px solid var(--border-subtle); display:flex; padding:8px 4px; z-index:10; }
  .tab-btn { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:12px; cursor:pointer; }
  .tab-btn svg { width:18px; height:18px; color:var(--text-muted); }
  .tab-btn span { font-size:8.5px; color:var(--text-muted); font-weight:700; }
  .tab-btn.active svg, .tab-btn.active span { color:var(--emerald); }

  .spacer { height:20px; }

  /* --- Compliance / legal / forms --- */
  .doc-card { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:12px; padding:13px; margin-bottom:9px; cursor:pointer; }
  .doc-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .doc-title { font-size:12.5px; font-weight:700; }
  .doc-meta { font-size:10px; color:var(--text-muted); margin-top:4px; }
  .doc-limit { font-size:13px; font-weight:800; color:var(--emerald); }
  .doc-limit-label { font-size:9px; color:var(--text-muted); text-align:left; }

  .clause-block { background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; margin-bottom:9px; }
  .clause-num { font-size:10px; color:var(--cyan-tech); font-weight:800; margin-bottom:4px; }
  .clause-text { font-size:11px; color:#D8E2EC; line-height:1.9; }

  .form-group { margin-bottom:13px; }
  .form-label { font-size:11px; color:var(--text-muted); margin-bottom:6px; display:block; }
  .form-input { width:100%; background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:9px; padding:11px; color:#fff; font-size:12.5px; font-family:inherit; }
  .form-input:focus { outline:none; border-color:var(--cyan-tech); }
  .chip-row { display:flex; gap:7px; flex-wrap:wrap; }
  .chip-opt { padding:8px 13px; border-radius:99px; font-size:11px; font-weight:600; border:1px solid var(--border-subtle); background:var(--surface-inner); color:var(--text-muted); cursor:pointer; }
  .chip-opt.selected { background:var(--emerald); color:var(--bg-dark); border-color:var(--emerald); }

  .kyc-toggle-row { display:flex; align-items:center; justify-content:space-between; background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; }

  .submit-btn { width:100%; background:var(--emerald); color:var(--bg-dark); border:none; border-radius:10px; padding:13px; font-size:12.5px; font-weight:800; cursor:pointer; margin-top:6px; }
  .submit-btn:disabled { opacity:.4; cursor:not-allowed; }

  .status-banner { border-radius:12px; padding:13px; display:flex; gap:10px; align-items:flex-start; margin-bottom:14px; }
  .status-banner.pending { background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.3); }
  .status-banner.done { background:rgba(0,230,118,.12); border:1px solid rgba(0,230,118,.3); }
  .status-banner svg { width:17px; height:17px; flex-shrink:0; margin-top:1px; }

  .nda-scroll { max-height:280px; overflow-y:auto; background:var(--surface-inner); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; font-size:10.5px; line-height:1.9; color:#C7D3DF; margin-bottom:12px; }
  .agree-row { display:flex; align-items:flex-start; gap:9px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; margin-bottom:12px; }
  .agree-row input { margin-top:2px; accent-color:var(--emerald); width:16px; height:16px; }
  .agree-row label { font-size:11px; line-height:1.6; }
  .sig-box { border:1.5px dashed var(--border-subtle); border-radius:10px; padding:16px; text-align:center; margin-bottom:14px; }
  .sig-name { font-family:'Brush Script MT', cursive; font-size:22px; color:var(--cyan-tech); }

  /* --- Corner logo badge (persistent, professional) --- */
  .logo-badge {
    position:absolute; top:16px; left:16px; z-index:25;
    width:38px; height:38px; border-radius:11px;
    background:linear-gradient(160deg,#0d1c30,#050b14);
    border:1px solid rgba(0,230,118,.4);
    box-shadow:0 4px 14px rgba(0,0,0,.5), 0 0 0 1px rgba(0,230,118,.08) inset;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-badge svg { width:22px; height:20px; }

  /* --- Financing tab --- */
  .fin-subtabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; }
  .fin-subtab { padding:8px 13px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; border:1px solid var(--border-subtle); background:var(--surface-inner); color:var(--text-muted); cursor:pointer; }
  .fin-subtab.active { background:var(--emerald); color:var(--bg-dark); border-color:var(--emerald); }
  .rate-row { display:flex; justify-content:space-between; align-items:center; margin-top:9px; padding-top:9px; border-top:1px solid var(--border-subtle); }
  .rate-label { font-size:9.5px; color:var(--text-muted); }
  .rate-val { font-size:11px; font-weight:800; color:var(--cyan-tech); text-align:left; max-width:170px; }
  .req-summary { background:var(--surface-inner); border:1px dashed var(--border-subtle); border-radius:10px; padding:12px; margin:12px 0 16px; font-size:11px; color:var(--text-muted); line-height:1.8; }
  .req-id { font-family:monospace; color:var(--emerald); font-weight:700; }
</style>
</head>
<body>
<div class="sim-wrap">
  <div class="sim-label">محاكي الجوال — نسخة المستخدم</div>
  <div class="phone">
    <div class="screen">
      <div id="splash">
        <div id="splashLogo"></div>
        <div class="logo-main-text">NEXIOS<span class="dot">.</span></div>
        <div class="logo-sub-text">FINANCE</div>
        <div class="logo-tagline">INTEGRATED FINANCE SOLUTIONS</div>
        <div class="dot-pulse"></div>
      </div>
      <div class="brand-strip" id="brandStrip"></div>
      <div class="logo-badge" id="logoBadge"></div>
      <div class="content" id="content"></div>
      <div class="tabbar" id="tabbar"></div>
    </div>
  </div>
</div>

<script>
const ic = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const ICONS = {
  home: ic(`<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>`),
  layers: ic(`<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>`),
  cards: ic(`<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/>`),
  receipt: ic(`<path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6"/><path d="M9 12h6"/>`),
  settings: ic(`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/>`),
  grip: ic(`<circle cx="8" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="18" r="1.3" fill="currentColor" stroke="none"/>`),
  check: ic(`<path d="M20 6 9 17l-5-5"/>`),
  lockClosed: ic(`<rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>`),
  arrowUpDown: ic(`<path d="M8 3v14"/><path d="M4 13l4 4 4-4"/><path d="M16 21V7"/><path d="M20 11l-4-4-4 4"/>`),
  moon: ic(`<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>`),
  globe: ic(`<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>`),
  fingerprint: ic(`<path d="M12 3a7 7 0 0 0-7 7c0 3 1 5 1 7"/><path d="M12 3a7 7 0 0 1 7 7c0 4-1 6-1 8"/><path d="M9 10a3 3 0 0 1 6 0c0 5 1 7 2 9"/><path d="M7 15c0-3-.5-4-.5-5"/><path d="M12 10v3c0 4 1 6 3 8"/>`),
  user: ic(`<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>`),
  logout: ic(`<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>`),
  chevronLeft: ic(`<path d="M15 18l-6-6 6-6"/>`),
  chevronRight: ic(`<path d="M9 18l6-6-6-6"/>`),
  plus: ic(`<path d="M12 5v14M5 12h14"/>`),
  fileText: ic(`<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h1"/>`),
  idCard: ic(`<rect x="2" y="5" width="20" height="14" rx="2.5"/><circle cx="8" cy="11" r="2"/><path d="M5 17c.5-2 2-3 3-3s2.5 1 3 3"/><path d="M14 9h5"/><path d="M14 13h5"/>`),
  shieldLock: ic(`<path d="M12 3l8 3v6c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V6l8-3Z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10.5 11V9.5a1.5 1.5 0 0 1 3 0V11"/>`),
  alertTriangle: ic(`<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/>`),
  clock: ic(`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>`),
};

function logoSVG(w,h){

function setTab(t){ state.tab = t; state.subpage = null; render(); }
function openSub(name, arg){ state.subpage = name; if(arg!==undefined) state.activeFacilityId = arg; render(); scrollContentTop(); }
function goBack(){ state.subpage = null; render(); scrollContentTop(); }
function setFinanceSubTab(t){ state.financeSubTab = t; render(); }
function setReqField(field, val){ state.financeRequest[field] = val; render(); }
function submitFinanceRequest(){
  const r = state.financeRequest;
  if(!r.bank || !r.type || !r.amount) return;
  r.submitted = true;
  r.requestId = 'REQ-' + Math.floor(100000 + Math.random()*899999);
  render();
}
function newFinanceRequest(){
  state.financeRequest = { bank:'', type:'', amount:'', purpose:'', submitted:false, requestId:null };
  render();
}
function scrollContentTop(){ const c = document.getElementById('content'); if(c) c.scrollTop = 0; }

function moveP(id,dir){
  const idx = state.priorities.findIndex(p=>p.id===id);
  const t = idx+dir; if(t<0||t>=state.priorities.length) return;
  [state.priorities[idx], state.priorities[t]] = [state.priorities[t], state.priorities[idx]];
  render();
}
function toggleBank(i){ state.banks[i].active = !state.banks[i].active; render(); }
function setFloor(v){ state.safetyFloor = v; document.getElementById('floorVal').textContent = fmt(v)+' ر.س'; }

function setKycField(field, val){ state.kyc[field] = val; render(); }
function togglePep(){ state.kyc.pep = !state.kyc.pep; render(); }
function submitKyc(){ state.kyc.submitted = true; render(); }

function onNdaScroll(el){
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 8) { state.ndaScrolledToEnd = true; }
}
function toggleNdaCheck(){
  if(!state.ndaScrolledToEnd) return;
  state.ndaAccepted = !state.ndaAccepted; render();
}

  let h = `<p class="page-title">مركز أمان المصرفية المفتوحة</p><p class="page-sub">إدارة الصلاحيات (SAMA Open Banking)</p>`;
  state.banks.forEach((b,i)=>{
    h += `<div class="perm-item">
      <div class="perm-top"><span>${b.name}</span><span style="color:${b.active?'var(--emerald)':'var(--text-muted)'};cursor:pointer" onclick="toggleBank(${i})">${b.active?'نشط':'إيقاف'}</span></div>
      <div class="perm-meta">${b.meta}</div>
    </div>`;
  });
  h += `<button class="revoke-btn">${ICONS.lockClosed} إلغاء جميع التفويضات وقطع الاتصال فوراً</button>

    <p style="font-size:11px;color:var(--text-muted);margin:20px 0 8px;font-weight:700">الوثائق والاتفاقيات القانونية</p>
    <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:0 10px">
      <div class="settings-item" onclick="setTab('financing')">
        <div class="ic" style="color:var(--emerald)">${ICONS.fileText}</div>
        <span class="lbl">التمويل مع البنوك</span>
        <span class="chev">${ICONS.chevronLeft.replace('width="24" height="24"','width="13" height="13"')}</span>
      </div>
      <div class="settings-item" onclick="openSub('kyc')">
        <div class="ic" style="color:var(--cyan-tech)">${ICONS.idCard}</div>
        <span class="lbl">نموذج اعرف عميلك (KYC)</span>
        <span class="chev" style="display:flex;align-items:center;gap:6px">
          ${state.kyc.submitted ? '<span class="pill pill-ok">مكتمل</span>' : '<span class="pill pill-warn">مطلوب</span>'}
          ${ICONS.chevronLeft.replace('width="24" height="24"','width="13" height="13"')}
        </span>
      </div>
      <div class="settings-item" onclick="openSub('nda')">
        <div class="ic" style="color:var(--gold)">${ICONS.shieldLock}</div>
        <span class="lbl">اتفاقية سرية المعلومات</span>
        <span class="chev" style="display:flex;align-items:center;gap:6px">
          ${state.ndaAccepted ? '<span class="pill pill-ok">موقّعة</span>' : '<span class="pill pill-warn">بانتظار التوقيع</span>'}
          ${ICONS.chevronLeft.replace('width="24" height="24"','width="13" height="13"')}
        </span>
      </div>
    </div>

    <p style="font-size:11px;color:var(--text-muted);margin:16px 0 8px;font-weight:700">ت٤ضيلات التطبيق</p>
    <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:0 10px">
      <div class="settings-item"><div class="ic">${ICONS.moon}</div><span class="lbl">المظهر الداكن</span><span class="chev"><button class="toggle on" style="pointer-events:none"><span class="knob"></span></button></span></div>
      <div class="settings-item"><div class="ic">${ICONS.globe}</div><span class="lbl">اللغة</span><span class="chev" style="display:flex;align-items:center;gap:4px;color:var(--text-muted);font-size:11px">العربية ${ICONS.chevronLeft.replace('width="24" height="24"','width="12" height="12"')}</span></div>
      <div class="settings-item"><div class="ic">${ICONS.fingerprint}</div><span class="lbl">الدخول ببصمة الإصبع</span><span class="chev"><button class="toggle on" style="pointer-events:none"><span class="knob"></span></button></span></div>
    </div>
    <p style="font-size:11px;color:var(--text-muted);margin:16px 0 8px;font-weight:700">الحساب</p>
    <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:0 10px">
      <div class="settings-item"><div class="ic">${ICONS.user}</div><span class="lbl">الملف الشخصي — HAMAD</span><span class="chev">${ICONS.chevronLeft.replace('width="24" height="24"','width="13" height="13"')}</span></div>

/* --- Financing tab (current / request new / priority) --- */
function renderFinancing(){
  let h = `<p class="page-title">التمويل</p><p class="page-sub">تمويلك الحالي مع البنوك، أو تقديم طلب تمويل جديد</p>
    <div class="fin-subtabs">
      <span class="fin-subtab ${state.financeSubTab==='current'?'active':''}" onclick="setFinanceSubTab('current')">التمويل الحالي</span>
      <span class="fin-subtab ${state.financeSubTab==='request'?'active':''}" onclick="setFinanceSubTab('request')">طلب تمويل جديد</span>
      <span class="fin-subtab ${state.financeSubTab==='priority'?'active':''}" onclick="setFinanceSubTab('priority')">أولوية الاستخدام</span>
    </div>`;

  if (state.financeSubTab === 'current') {
    financingTerms.forEach(f=>{
      h += `<div class="doc-card" onclick="openSub('financing-detail','${f.id}')">
        <div class="doc-top">
          <div><div class="doc-title">${f.bank}</div><div class="doc-meta">${f.type}</div></div>
          <div><div class="doc-limit">${f.limit}</div><div class="doc-limit-label">${f.limitLabel}</div></div>
        </div>
        <div class="rate-row">
          <span class="rate-label">الفائدة / العائد</span>
          <span class="rate-val">${f.rate}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px">
          <span class="pill pill-ok">${f.status}</span>
          <span style="font-size:10px;color:var(--text-muted)">موقّعة في ${f.signed}</span>
        </div>
      </div>`;
    });
    h += `<div class="add-dashed" style="border:1.5px dashed var(--border-subtle);border-radius:14px;padding:13px;text-align:center;color:var(--text-muted);font-size:12px;margin-top:6px;cursor:pointer" onclick="setFinanceSubTab('request')">${ICONS.plus}<span> طلب تمويل إضافي من بنك جديد</span></div>`;
  } else if (state.financeSubTab === 'request') {
    const r = state.financeRequest;
    if (r.submitted) {
      h += `<div class="status-banner done">${ICONS.check}<div><b style="font-size:12px">تم إرسال طلب التمويل</b><div style="font-size:11px;color:var(--text-muted);margin-top:3px">سيتم التواصل من البنك خلال يوم عمل واحد عادةً.</div></div></div>
        <div class="req-summary">
          <div>رقم الطلب: <span class="req-id">${r.requestId}</span></div>
          <div style="margin-top:6px">البنك: <b style="color:#fff">${r.bank}</b></div>
          <div>نوع التمويل: <b style="color:#fff">${r.type}</b></div>
          <div>المبلغ المطلوب: <b style="color:var(--emerald)">${fmt(Number(r.amount))} ر.س</b></div>
        </div>
        <button class="submit-btn" style="background:var(--surface-inner);color:#fff;border:1px solid var(--border-subtle)" onclick="newFinanceRequest()">تقديم طلب آخر</button>`;
    } else {
      h += `
        <div class="form-group">
          <span class="form-label">اختر البنك أو المزود</span>
          <div class="chip-row">${availableBanks.map(b=>`<span class="chip-opt ${r.bank===b?'selected':''}" onclick="setReqField('bank','${b}')">${b}</span>`).join('')}</div>
        </div>
        <div class="form-group">
          <span class="form-label">نوع التمويل المطلوب</span>
          <div class="chip-row">${financeTypes.map(t=>`<span class="chip-opt ${r.type===t?'selected':''}" onclick="setReqField('type','${t}')">${t}</span>`).join('')}</div>
        </div>
        <div class="form-group">
          <span class="form-label">المبلغ المطلوب (ر.س)</span>
          <input class="form-input" type="number" placeholder="مثال: 15000" value="${r.amount}" oninput="state.financeRequest.amount=this.value">
        </div>
        <div class="form-group">
          <span class="form-label">الغرض من التمويل (اختياري)</span>
          <input class="form-input" placeholder="مثال: تغطية مصاريف تشغيلية" value="${r.purpose}" oninput="state.financeRequest.purpose=this.value">
        </div>
        <button class="submit-btn" ${(!r.bank||!r.type||!r.amount)?'disabled':''} onclick="submitFinanceRequest()">إرسال طلب التمويل</button>
        <p style="font-size:9.5px;color:var(--text-muted);margin-top:8px;line-height:1.6">يخضع الطلب لمراجعة الجهة الممولة ونتائج نموذج عملك (KYC) الخاص بك.</p>`;
    }
  } else {
    h += renderPriorityInner();
  }
  h += `<div class="spacer"></div>`;
  return h;
}

function renderFinancingDetail(){
  const f = financingTerms.find(x=>x.id===state.activeFacilityId) || financingTerms[0];
  let h = `<p class="page-title">${f.bank}</p><p class="page-sub">${f.type}</p>
    <div class="hero-box" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between">
        <div><span class="hero-label">${f.limitLabel}</span><div class="hero-value" style="font-size:18px">${f.limit}</div></div>
        <div style="text-align:left"><span class="hero-label">الرسوم</span><div style="font-size:11px;font-weight:700;margin-top:6px;max-width:140px">${f.rate}</div></div>
      </div>
    </div>
    <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:700">بنود الاتفاقية:</p>`;
  f.clauses.forEach((c,i)=>{
    h += `<div class="clause-block"><div class="clause-num">البند ${i+1}</div><div class="clause-text">${c}</div></div>`;
  });
  h += `<div class="spacer"></div>`;
  return h;
}

/* --- KYC form --- */
function renderKyc(){
  if (state.kyc.submitted) {
    return `
      <p class="page-title">نموذج اعرف عميلك (KYC)</p>
      <div class="status-banner done">${ICONS.check}<div><b style="font-size:12px">تٜاستلام النموذج</b><div style="font-size:11px;color:var(--text-muted);margin-top:3px">طلبك قيد المراجعة من فريق الامتثال، عادة خلال 24 ساعة عمل.</div></div></div>
      <div class="doc-card">
        <div class="doc-top"><div class="doc-title">رقم الهوية الوطنية</div><div style="font-size:12px">${state.kyc.nationalId || '••••••••••'}</div></div>
      </div>
      <div class="doc-card"><div class="doc-top"><div class="doc-title">مصدر الدخل</div><div style="font-size:12px">${state.kyc.incomeSource}</div></div></div>
      <div class="doc-card"><div class="doc-top"><div class="doc-title">نطاق الدخل الشهري</div><div style="font-size:12px">${state.kyc.incomeRange} ر.س</div></div></div>
      <div class="doc-card"><div class="doc-top"><div class="doc-title">شخص سياسي مُعرَّض (PEP)</div><div style="font-size:12px">${state.kyc.pep?'نعم':'لا'}</div></div></div>
      <div class="spacer"></div>`;
  }
  return `
    <p class="page-title">نموذج اعرف عميلك (KYC)</p>
    <p class="page-sub">متطلب إلزامي وفق أنظمة مكافحة غسل الأموال (AML/CFT) الصادرة عن ساما</p>

    <div class="form-group">
      <span class="form-label">الاسم الكامل (كما في الهوية)</span>
      <input class="form-input" value="HAMAD" disabled>
    </div>
    <div class="form-group">
      <span class="form-label">رقم الهوية الوطنية / الإقامة</span>
      <input class="form-input" placeholder="1XXXXXXXXX" value="${state.kyc.nationalId}" oninput="setKycFieldSilent('nationalId', this.value)">
    </div>
    <div class="form-group">
      <span class="form-label">تاريخ الميلاد</span>
      <input class="form-input" type="date" value="${state.kyc.dob}" onchange="setKycField('dob', this.value)">
    </div>
    <div class="form-group">
      <span class="form-label">مصدر الدخل الأساسي</span>
      <div class="chip-row">
        ${['راتب','عمل حر','استثمارات','ميراث','أخرى'].map(o=>`<span class="chip-opt ${state.kyc.incomeSource===o?'selected':''}" onclick="setKycField('incomeSource','${o}')">${o}</span>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <span class="form-label">نطاق الدخل الشهري (ر.س)</span>
      <div class="chip-row">
        ${['أقل من 10,000','10,000 - 20,000','20,000 - 50,000','أكثر من 50,000'].map(o=>`<span class="chip-opt ${state.kyc.incomeRange===o?'selected':''}" onclick="setKycField('incomeRange','${o}')">${o}</span>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <span class="form-label">جهة العمل</span>
      <input class="form-input" placeholder="اسم الشركة أو الجهة" value="${state.kyc.employer}" oninput="setKycFieldSilent('employer', this.value)">
    </div>
    <div class="form-group">
      <span class="form-label">المسمى الوظيفي</span>
      <input class="form-input" placeholder="مثال: مدير مشاريع" value="${state.kyc.occupation}" oninput="setKycFieldSilent('occupation', this.value)">
    </div>
    <div class="form-group kyc-toggle-row">
      <span style="font-size:11.5px">هل أنت أو أحد أقاربك شخص سياسي مُعرَّض (PEP)؟</span>
      <button class="toggle ${state.kyc.pep?'on':'off'}" onclick="togglePep()"><span class="knob"></span></button>
    </div>

    <button class="submit-btn" onclick="submitKyc()">إرسال النموذج للمراجعة</button>
    <p style="font-size:9.5px;color:var(--text-muted);margin-top:8px;line-height:1.6">بإرسال هذا النموذج، تقر بصحة البيانات المدخلة وفق نظام مكافحة غسل الأموال وتمويل الإرهاب.</p>
    <div class="spacer"></div>`;
}

// inputs update state silently without full re-render (keeps focus while typing)
function setKycFieldSilent(field, val){ state.kyc[field] = val; }

/* --- NDA --- */
function renderNda(){
  if (state.ndaAccepted) {
    return `
      <p class="page-title">اتفاقية سرية المعلومات</p>
      <div class="status-banner done">${ICONS.check}<div><b style="font-size:12px">تم توقيع الاتفاقية</b><div style="font-size:11px;color:var(--text-muted);margin-top:3px">أصبحت الاتفاقية سارية المفعول على حسابك.</div></div></div>
      <div class="sig-box">
        <div class="sig-name">Hamad</div>
        <p style="font-size:10px;color:var(--text-muted);margin-top:8px">تم التوقيع إلكترونياً — 16 سبتمبر 2026</p>
      </div>
      <div class="spacer"></div>`;
  }
  return `
    <p class="page-title">اتفاقية سرية المعلومات</p>
    <p class="page-sub">يرجى قراءة الاتفاقية كاملة قبل التوقيع</p>
    <div class="status-banner pending">${ICONS.alertTriangle}<div><b style="font-size:12px">قراءة مطلوبة</b><div style="font-size:11px;color:var(--text-muted);margin-top:3px">مرّر للأسفل حتى نهاية النص لتفعيل زر الموافقة.</div></div></div>
    <div class="nda-scroll" onscroll="onNdaScroll(this)">${ndaText.replace(/\n/g,'<br>')}</div>
    <div class="agree-row">
      <input type="checkbox" id="ndaCheck" ${state.ndaAccepted?'checked':''} ${state.ndaScrolledToEnd?'':'disabled'} onchange="toggleNdaCheck()">
      <label for="ndaCheck">أقر بأنني قرأت اتفاقية سرية المعلومات كاملة وأوافق على جميع بنودها.</label>
    </div>
    <button class="submit-btn" ${state.ndaScrolledToEnd?'':'disabled'} onclick="document.getElementById('ndaCheck').checked=true; toggleNdaCheck2()">توقيع الاتفاقية إلكترونياً</button>
    <div class="spacer"></div>`;
}
function toggleNdaCheck2(){ if(state.ndaScrolledToEnd){ state.ndaAccepted = true; render(); } }

const TABS = [
  { key:'home', label:'الرئيسية', icon:'home' },
  { key:'financing', label:'التمويل', icon:'fileText' },
  { key:'cards', label:'البطاقات', icon:'cards' },
  { key:'activity', label:'العمليات', icon:'receipt' },
  { key:'settings', label:'الإعدادات', icon:'settings' },
];

const SUBPAGE_TITLES = {
  'financing-detail': 'تفاصيل الاتفاقية',
  'kyc': 'اعرف عميلك',
  'nda': 'اتفاقية السرية',
};

function render(){
  const brandEl = document.getElementById('brandStrip');
  if (state.subpage) {
    brandEl.innerHTML = `<button class="brand-back" onclick="goBack()">${ICONS.chevronRight}<span>رجوع</span></button><span>${SUBPAGE_TITLES[state.subpage]}</span>`;
  } else {
    brandEl.innerHTML = `${logoSVG(30,13)}<span>NEXIOS<span class="dot">.</span> FINANCE</span>`;
  }

  let body='';
  if (state.subpage === 'financing-detail') body = renderFinancingDetail();
  else if (state.subpage === 'kyc') body = renderKyc();
  else if (state.subpage === 'nda') body = renderNda();
  else if (state.tab==='home') body = renderHome();
  else if (state.tab==='financing') body = renderFinancing();
  else if (state.tab==='cards') body = renderCards();
  else if (state.tab==='activity') body = renderActivity();
  else body = renderSettings();

  document.getElementById('content').innerHTML = body;
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`
    <button class="tab-btn ${(!state.subpage && state.tab===t.key)?'active':''}" onclick="setTab('${t.key}')">${ICONS[t.icon]}<span>${t.label}</span></button>
  `).join('');
}

document.getElementById('splashLogo').innerHTML = logoSVG(190,78);
document.getElementById('logoBadge').innerHTML = logoIconSVG();
render();
</script>
</body>
</html>
