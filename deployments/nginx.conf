# Serves the two static prototype apps (web/user-app.html, web/admin-app.html)
# and reverse-proxies the API under /v1 and /healthz to the orchestrator
# service, so the whole system is reachable through one host:port on a
# local/on-prem server - docker-compose.yml mounts ../web read-only at
# /usr/share/nginx/html and this file at /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index user-app.html;

    location = / {
        return 302 /user-app.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /healthz {
        proxy_pass http://orchestrator:8080/healthz;
    }

    location /v1/ {
        proxy_pass http://orchestrator:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
