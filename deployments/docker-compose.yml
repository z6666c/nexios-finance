# Brings up a complete, browser-reachable Nexios Finance stack on a single
# local/on-prem server: a Postgres database, the Go orchestrator API, and
# an nginx server for the two static prototype apps that reverse-proxies
# API calls through to the orchestrator - so `docker compose up --build`
# from this directory is enough to get a working system end to end.
#
# Quick start:
#   cd deployments
#   docker compose up --build
#   open http://localhost:8082/            (user app)
#   open http://localhost:8082/admin-app.html
#
# To require an API key (recommended for anything beyond a local demo),
# set NEXIOS_AUTH_API_KEY before starting, e.g.:
#   NEXIOS_AUTH_API_KEY=$(openssl rand -hex 24) docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexios
      POSTGRES_USER: nexios
      POSTGRES_PASSWORD: nexios
      # internal/pgwire (this project's dependency-free Postgres client,
      # see its package doc) supports cleartext and MD5 password auth but
      # not SCRAM - Postgres 16's default. This forces MD5 so a plain
      # `docker compose up` works with no extra configuration.
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - nexios-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexios -d nexios"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    environment:
      NEXIOS_LEDGER_DRIVER: postgres
      NEXIOS_LEDGER_DSN: postgres://nexios:nexios@postgres:5432/nexios?sslmode=disable
      NEXIOS_AUTH_API_KEY: ${NEXIOS_AUTH_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080" # direct API access, e.g. for curl/Postman

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - orchestrator

volumes:
  nexios-pgdata: {}
